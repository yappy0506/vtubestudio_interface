[project]
name = "vtsd"
version = "0.1.0"
description = "Windows daemon for VTube Studio Public API"
requires-python = ">=3.10"
dependencies = [
  "websockets>=12.0"
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
